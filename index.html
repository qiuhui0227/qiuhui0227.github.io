<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18354a">
  <title>OASIS | Qiuhui & Yan 专属情侣空间</title>
  <link rel="icon" type="image/png" href="./images/logo.png">

  <!-- 加载完全复刻 USV Lab 经典美学与艺术扩展的样式表 (带强力防缓存指纹) -->
  <link rel="stylesheet" href="./css/style.css?v=202611051750">
  <link rel="stylesheet" href="./css/resume.css?v=202611051750">
  <link rel="stylesheet" href="./css/albums.css?v=202611051750">
  <link rel="stylesheet" href="./css/responsive.css?v=202611051750">
  <link rel="stylesheet" href="./css/meals.css?v=202611051750">
</head>
<body>

  <!-- ==========================================================================
       1. 门禁锁屏界面 (复刻 USV Lab 经典登录页面)
       深蓝夜海径向渐变底色 + 右上角三层同心轨道几何光晕 + 白色大圆角浮升卡片
       ========================================================================== -->
  <div id="screen-lock" class="login-layout">
    <section class="login-panel">
      <div class="brand">
        <span class="brand-mark">O</span>
        <span>OASIS <span class="brand-light">/ SPACE</span></span>
      </div>
      <h1>Qiuhui & Yan<br>专属情侣空间<span class="period">.</span></h1>
      <p class="login-intro">私属星系 · 客厅与卧室双模门禁。<br>输入访问通行码，即可入座。</p>

      <form id="gate-login-form" class="login-form" autocomplete="off">
        <div>
          <label class="form-label" for="gate-password-input">访问通行码</label>
          <input 
            class="input" 
            id="gate-password-input" 
            name="password" 
            type="password" 
            required 
            placeholder="请输入访问通行码" 
            autocomplete="current-password" 
            autofocus
          >
        </div>
        <button class="btn btn-primary block" id="gate-login-btn" type="submit">
          进入专属空间
          <svg class="ico" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div id="gate-error-tip" class="fine" style="color: #a7464c; text-align: center; min-height: 18px;"></div>
      </form>

      <p class="login-foot">
        ✨ 私密空间仅对受邀访客及主人开放 · 请凭通行码入座
      </p>
    </section>
  </div>


  <!-- ==========================================================================
       2. 空间主界面 (复刻 USV Lab 的 .site, .topline, .hero, .content, .tabs)
       ========================================================================== -->
  <div id="screen-app" style="display: none;">
    <div class="site">
      
      <!-- Topline 顶部状态栏 -->
      <div class="topline">
        <!-- 左上角三餐相机入口 (两个字一行，整齐优雅) -->
        <button type="button" class="meal-cam-top-btn" id="btn-top-meal-cam" title="点击打开三餐手帐与拍照打卡">
          <div class="meal-cam-icon-box">
            <svg class="meal-cam-ico-top" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
              <circle cx="12" cy="13" r="3"/>
              <path d="M18 10h.01"/>
            </svg>
          </div>
          <div class="meal-cam-text-col">
            <span class="meal-cam-line">三餐</span>
            <span class="meal-cam-line">相机</span>
          </div>
        </button>
        <div class="top-actions">
          <span class="name-tag cloud-tag" id="header-cloud-badge" title="Cloudflare 云端双向实时同步状态">
            <span class="cloud-dot"></span>
            <span class="cloud-text">云端已同步</span>
          </span>
          <span class="name-tag" id="header-role-badge">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
            <span>卧室主人 (全特权)</span>
          </span>
          <button class="btn btn-outline btn-sm" id="btn-switch-master" style="display:none;">🔑 进卧室</button>
          <button class="logout" id="btn-logout" title="锁定并退出空间">
            <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            锁屏
          </button>
        </div>
      </div>

      <!-- Content 核心内容卡片 -->
      <section class="content">
        <!-- Tabs 分段切换器 -->
        <div class="tabs">
          <button type="button" class="tab active" data-tab="timetable">
            <svg class="ico" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 12h6m-6 4h4"/></svg>
            小黑板
          </button>
          <button type="button" class="tab" data-tab="albums">
            <svg class="ico" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            岁月相册
          </button>
          <button type="button" class="tab" id="tab-btn-resume" data-tab="resume">
            <svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            履历文库
          </button>
          <button type="button" class="tab" id="tab-btn-settings" data-tab="settings">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM4 12H2m20 0h-2M12 4V2m0 20v-2M5 5 3.5 3.5M20.5 20.5 19 19M19 5l1.5-1.5M3.5 20.5 5 19"/></svg>
            空间管理
          </button>
        </div>

        <!-- 各模块挂载容器 -->
        <div id="content-timetable"></div>
        <div id="content-albums" style="display:none;"></div>
        <div id="content-resume" style="display:none;"></div>
        <div id="content-settings" style="display:none;"></div>
      </section>

      <!-- Footer 底部版权与说明 -->
      <div class="footer">
        Qiuhui & Yan 专属情侣空间 · 记刻两人的温暖时光与点滴岁月 · 云端实时双向加密同步<br>
        纯静态架构严格保障双人隐私，离线也能完整运行
      </div>

    </div>
  </div>

  <!-- Toast 浮动提示组件 (复刻 USV Lab 原生 Toast) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 脚本模块按顺序载入 (带强力防缓存指纹) -->
  <script src="./js/store.js?v=202611051750"></script>
  <script src="./js/auth.js?v=202611051750"></script>
  <script src="./js/timetable.js?v=202611051750"></script>
  <script src="./js/albums.js?v=202611051750"></script>
  <script src="./js/resume.js?v=202611051750"></script>
  <script src="./js/meals.js?v=202611051750"></script>
  <script src="./js/app.js?v=202611051750"></script>
</body>
</html>
