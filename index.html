<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OASIS | Qiuhui & Yan 专属情侣空间</title>
  <link rel="icon" type="image/png" href="./images/logo.png">

  <!-- 样式加载 -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/resume.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

  <!-- ==========================================================================
       1. 门禁锁屏界面 (Entry Gate Lock Screen)
       ========================================================================== -->
  <div id="screen-lock">
    <div class="gate-card card-glass animate-pop">
      <div class="gate-logo-badge">
        <img src="./images/logo.png" alt="OASIS Logo" onerror="this.style.display='none';">
      </div>
      <h1>OASIS · 私属空间</h1>
      <p class="gate-subtitle">Qiuhui & Yan 的双人星系 · 客厅与卧室双模门禁</p>

      <form id="gate-login-form">
        <div class="gate-input-wrap">
          <input 
            type="password" 
            id="gate-password-input" 
            class="input" 
            placeholder="请输入访问密码..." 
            autocomplete="current-password" 
            required 
            autofocus
          >
          <span class="form-error" id="gate-error-tip"></span>
        </div>
        <button type="submit" class="btn btn-primary gate-btn-enter">
          进入空间
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="gate-info-box">
        <p><strong>🚪 通行提示：</strong></p>
        <p>• <strong>🛏️ 主人密码</strong> (初始: <code>admin</code>)：直达卧室，解锁所有私密相册、全量时刻表、简历编辑器与后台安全配置。</p>
        <p>• <strong>🛋️ 来宾密码</strong> (初始: <code>guest888</code>)：入座客厅，仅翻阅开放相册与公开日常。支持有效次数与有效期保护。</p>
      </div>
    </div>
  </div>


  <!-- ==========================================================================
       2. 空间主应用界面 (Main Couple Space App)
       ========================================================================== -->
  <div id="screen-app" style="display: none;">
    
    <!-- 顶部导航栏 -->
    <header class="app-header">
      <div class="header-container">
        <div class="header-left">
          <a href="#" class="header-logo-link" onclick="location.reload(); return false;">
            <img src="./images/logo.png" class="header-logo-img" alt="Logo" onerror="this.style.display='none';">
            <span class="header-brand-name">OASIS | Qiuhui & Yan</span>
          </a>
          <span id="header-role-badge" class="badge"></span>
        </div>

        <!-- 桌面端导航选项卡 -->
        <nav class="header-nav" id="header-nav">
          <a href="#timetable" class="nav-link active" data-tab="timetable">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            共享时刻表
          </a>
          <a href="#albums" class="nav-link" data-tab="albums">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            时光相簿
          </a>
          <a href="#resume" class="nav-link" id="nav-tab-resume" data-tab="resume">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            简历编辑器
          </a>
          <a href="#settings" class="nav-link" id="nav-tab-settings" data-tab="settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            后台管理
          </a>
        </nav>

        <div class="header-right">
          <button class="btn btn-sm btn-outline" id="btn-switch-master" style="display:none;" title="验证主人密码以进入卧室">
            🔑 进卧室
          </button>
          <button class="btn btn-sm btn-secondary" id="btn-logout" title="锁定并登出空间">
            🚪 锁屏
          </button>
        </div>
      </div>
    </header>

    <!-- 主体内容承载容器 -->
    <main class="app-main-content">
      <!-- 1. 时刻表板块容器 -->
      <section id="content-timetable"></section>

      <!-- 2. 时光相簿板块容器 -->
      <section id="content-albums" style="display: none;"></section>

      <!-- 3. 简历编辑器板块容器 (仅主人) -->
      <section id="content-resume" style="display: none;"></section>

      <!-- 4. 后台设置中心容器 (仅主人) -->
      <section id="content-settings" style="display: none;"></section>
    </main>

    <!-- 移动端专用底部悬浮导航栏 -->
    <nav class="mobile-bottom-nav">
      <button class="mobile-nav-item active" data-tab="timetable">
        <span class="nav-icon">📅</span>
        <span>时刻表</span>
      </button>
      <button class="mobile-nav-item" data-tab="albums">
        <span class="nav-icon">📖</span>
        <span>相簿</span>
      </button>
      <button class="mobile-nav-item" id="mobile-nav-resume" data-tab="resume">
        <span class="nav-icon">📄</span>
        <span>简历</span>
      </button>
      <button class="mobile-nav-item" id="mobile-nav-settings" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span>设置</span>
      </button>
    </nav>

  </div>

  <!-- 脚本模块按依赖加载 -->
  <script src="./js/store.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/timetable.js"></script>
  <script src="./js/albums.js"></script>
  <script src="./js/resume.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
